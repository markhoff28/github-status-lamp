; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = seeed_xiao_esp32c3

[env:seeed_xiao_esp32c3]
platform = espressif32@6.12.0
board = seeed_xiao_esp32c3
framework = arduino
board_build.partitions = min_spiffs.csv
build_src_filter = +<*> -<led_diagnostic.cpp>

monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0

lib_deps =
    adafruit/Adafruit NeoPixel@1.12.3
    bblanchon/ArduinoJson@7.4.3
    tzapu/WiFiManager@2.0.17

[env:led_diagnostic]
extends = env:seeed_xiao_esp32c3
build_src_filter = -<*> +<led_diagnostic.cpp>
lib_deps = fastled/FastLED@3.10.5

[env:led_diagnostic_neopixel]
extends = env:led_diagnostic
build_flags = -DLED_DIAGNOSTIC_NEOPIXEL
lib_deps = adafruit/Adafruit NeoPixel@1.12.3
